name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Fetch NCV libs
        shell: bash
        run: ./scripts/fetch-libs.sh
      - name: Build
        run: dotnet build src/NNDD-RE.csproj -c Release -o out
      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: NNDD-RE
          path: out/NNDD-RE.dll
